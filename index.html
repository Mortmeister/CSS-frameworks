<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Morten Lillehaug" />
    <meta
      name="description"
      content="A modern social media platform built with Bootstrap. Share posts, and connect with others."
    />
    <meta name="keywords" content="HTML, CSS, JavaScript" />
    <title>Document</title>

    <link rel="stylesheet" href="./styles/css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body class="min-vh-100 d-flex flex-column auth-page">
    <div>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Frameworks</a>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>

              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="/feed/index.html"
                  >Feed</a
                >
              </li>

              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#"
                  >Profile</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
      <div
        class="container min-vh-100 d-flex align-items-center justify-content-center py-5"
      >
        <div class="card shadow-lg" style="max-width: 500px; width: 100%">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <h1 class="display-4 mb-2 font-stroke">SocialHub</h1>
              <p class="text-muted">Connect with friends and share moments</p>
            </div>

            <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  id="login-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#login"
                  type="button"
                  role="tab"
                >
                  Login
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="register-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#register"
                  type="button"
                  role="tab"
                >
                  Register
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <div class="tab-pane fade show active" id="login" role="tabpanel">
                <form action="./profile/index.html" method="GET" id="loginForm">
                  <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-group">
                      <span class="input-group-text" id="basic-addon1">@</span>
                      <input
                        type="email"
                        class="form-control"
                        placeholder="Enter email adress"
                        id="email"
                        aria-describedby="emailHelp"
                      />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label"
                      >Password</label
                    >
                    <div class="input-group">
                      <span class="input-group-text" id="basic-addon1">
                        <i class="bi bi-file-lock2-fill"></i>
                      </span>
                      <input
                        type="password"
                        class="form-control"
                        placeholder="password"
                        id="exampleInputPassword1"
                        minlength="8"
                      />
                    </div>
                  </div>
                  <div className="d-flex justify-content-end mb-3">
                    <a href="#" className="text-decoration-none small">
                      Forgot Password?
                    </a>
                  </div>
                  <div>
                    <button type="submit" class="btn btn-primary w-100">
                      Log in
                    </button>
                  </div>
                </form>
              </div>

              <div class="tab-pane fade" id="register" role="tabpanel">
                <form action="/profile" method="post" id="registerForm">
                  <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="registerEmail"
                      name="email"
                      placeholder="Enter your email"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="registerUsername" class="form-label"
                      >Username</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="registerUsername"
                      name="username"
                      placeholder="Choose a username"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="registerPassword" class="form-label"
                      >Password</label
                    >
                    <input
                      type="password"
                      class="form-control"
                      id="registerPassword"
                      name="password"
                      placeholder="Create a password"
                      minlength="8"
                      required
                    />
                    <div class="form-text">
                      Password must be at least 8 characters long.
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="registerConfirmPassword" class="form-label"
                      >Confirm Password</label
                    >
                    <input
                      type="password"
                      class="form-control"
                      id="registerConfirmPassword"
                      name="confirm-password"
                      placeholder="Confirm your password"
                      minlength="8"
                      required
                    />
                  </div>
                  <button type="submit" class="btn btn-primary w-100">
                    Register
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="bg-body-tertiary mt-auto">
      <footer class="container">
        <div class="container text-center">
          <p class="mb-0 fs-4">CSS Framworks</p>
        </div>
      </footer>
    </div>
  </body>
</html>
