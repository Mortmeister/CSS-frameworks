<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Morten Lillehaug" />
    <meta
      name="description"
      content="A modern social media platform built with Bootstrap. Share posts, and connect with others."
    />
    <meta name="keywords" content="HTML, CSS, JavaScript" />
    <title>SocialHub - Feed</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../styles/css/styles.css" />
    <script type="module" src="./feed.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="feed-page">
    <header
      class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top d-none d-md-block"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="/feed">
          <h1 class="h3 mb-0">SocialHub</h1>
        </a>

        <div class="d-flex gap-2">
          <a href="/feed" class="btn btn-light">
            <i class="bi bi-house-door"></i>
          </a>

          <a href="/profile" class="btn btn-light">
            <i class="bi bi-person"></i>
          </a>
        </div>

        <a href="../index.html" class="btn btn-outline-danger">
          <i class="bi bi-box-arrow-right me-1"></i>
          Logout
        </a>
      </div>
    </header>

    <nav class="mobile-bottom-nav d-md-none bg-white border-top fixed-bottom">
      <div class="d-flex justify-content-around py-2">
        <a href="/feed" class="btn btn-light">
          <i class="bi bi-house-door"></i>
          <p>Home</p>
        </a>

        <button
          class="btn btn-light"
          data-bs-toggle="modal"
          data-bs-target="#newPostModal"
        >
          <i class="bi bi-plus-circle"></i>
          <p>New post</p>
        </button>

        <a href="/profile" class="btn btn-light">
          <i class="bi bi-person"></i>
          <p>Profile</p>
        </a>
      </div>
    </nav>

    <main class="container py-4" style="max-width: 800px">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control"
              id="searchInput"
              placeholder="Search posts..."
            />
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="sortSelect">
            <option value="recent">Most Recent</option>
            <option value="popular">Most Popular</option>
          </select>
        </div>
        <div class="col-md-3">
          <button
            class="btn btn-primary w-100"
            data-bs-toggle="modal"
            data-bs-target="#newPostModal"
          >
            <i class="bi bi-plus-lg me-2"></i>New Post
          </button>
        </div>
      </div>

      <div id="postsFeed"></div>
    </main>

    <div class="modal fade" id="newPostModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Create a new post</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="newPostForm">
              <div class="mb-3">
                <label for="postContent" class="form-label">Content</label>
                <textarea
                  class="form-control"
                  id="postContent"
                  rows="4"
                  placeholder="What's on your mind?"
                  required
                ></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Post</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-body-tertiary mt-auto">
      <footer class="container">
        <div class="container text-center">
          <p class="mb-0 fs-4">CSS Framworks</p>
        </div>
      </footer>
    </div>
  </body>
</html>
