<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Morten Lillehaug" />
    <meta
      name="description"
      content="A modern social media platform built with Bootstrap. Share posts, and connect with others."
    />
    <meta name="keywords" content="HTML, CSS, JavaScript" />
    <title>SocialHub - Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../styles/css/styles.css" />
    <script type="module" src="./profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body class="profile-page auth-page">
    <header
      class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top d-none d-md-block"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="/feed">
          <h1 class="h3 mb-0">SocialHub</h1>
        </a>

        <div class="d-flex gap-2">
          <a href="/feed" class="btn btn-light">
            <i class="bi bi-house-door"></i>
          </a>

          <a href="/profile" class="btn btn-light">
            <i class="bi bi-person"></i>
          </a>
        </div>

        <a href="../index.html" class="btn btn-outline-danger">
          <i class="bi bi-box-arrow-right me-1"></i>
          Logout
        </a>
      </div>
    </header>

    <nav class="mobile-bottom-nav d-md-none bg-white border-top fixed-bottom">
      <div class="d-flex justify-content-around py-2">
        <a href="/feed" class="btn btn-light">
          <i class="bi bi-house-door"></i>
          <p>Home</p>
        </a>

        <button
          class="btn btn-light"
          data-bs-toggle="modal"
          data-bs-target="#newPostModal"
        >
          <i class="bi bi-plus-circle"></i>
          <p>New post</p>
        </button>

        <a href="/profile" class="btn btn-light">
          <i class="bi bi-person"></i>
          <p>Profile</p>
        </a>
      </div>
    </nav>

    <main class="container py-4" style="max-width: 1000px">
      <div class="card mb-4">
        <div class="card-body p-4">
          <div class="row align-items-center g-4">
            <div class="col-auto">
              <img
                src="https://images.chesscomfiles.com/uploads/v1/user/9525404.5c271372.200x200o.b689ca97c9c5.jpeg"
                alt="Profile"
                class="rounded-circle profile-avatar"
              />
            </div>
            <div class="col">
              <div
                class="d-flex flex-column flex-md-row align-items-start align-items-md-center gap-3 mb-3"
              >
                <h2 class="h3 mb-0" id="profileUsername">user</h2>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" id="followBtn">
                    <i class="bi bi-person-plus me-2"></i>Follow
                  </button>
                  <button class="btn btn-outline-secondary">
                    <i class="bi bi-gear me-2"></i>Edit Profile
                  </button>
                </div>
              </div>

              <div class="d-flex gap-4 mb-3">
                <div>
                  <strong id="postsCount">6</strong>
                  <span class="text-muted ms-1">posts</span>
                </div>
                <div>
                  <strong id="followersCount">4</strong>
                  <span class="text-muted ms-1">followers</span>
                </div>
                <div>
                  <strong id="followingCount">3</strong>
                  <span class="text-muted ms-1">following</span>
                </div>
              </div>

              <p class="mb-1">Welcome to my profile page!</p>
              <p class="text-muted mb-0">Living life</p>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <ul class="nav nav-tabs nav-fill" id="profileTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="posts-tab"
              data-bs-toggle="tab"
              data-bs-target="#posts"
              type="button"
              role="tab"
            >
              Posts
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="followers-tab"
              data-bs-toggle="tab"
              data-bs-target="#followers"
              type="button"
              role="tab"
            >
              Followers
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="following-tab"
              data-bs-toggle="tab"
              data-bs-target="#following"
              type="button"
              role="tab"
            >
              Following
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active p-2" id="posts" role="tabpanel">
            <div class="row g-2" id="userPostsGrid"></div>
          </div>

          <div class="tab-pane fade" id="followers" role="tabpanel">
            <div class="card-body">
              <div id="followersList"></div>
            </div>
          </div>

          <div class="tab-pane fade" id="following" role="tabpanel">
            <div class="card-body">
              <div id="followingList"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="bg-body-tertiary mt-auto">
      <footer class="container">
        <div class="container text-center">
          <p class="mb-0 fs-4">CSS Framworks</p>
        </div>
      </footer>
    </div>
  </body>
</html>
